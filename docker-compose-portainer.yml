services:
  portainer:
    image: portainer/portainer-ce:2.27.1-alpine
    container_name: edutrace-portainer
    command: --http-disabled
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${PORTAINER_HTTPS_PORT:-9443}:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    restart: unless-stopped

volumes:
  portainer_data:
