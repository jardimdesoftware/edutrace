version: "3.8"

services:
  # Prometheus - Monitoramento
  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: prometheus
    read_only: true
    security_opt:
      - no-new-privileges:true
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "127.0.0.1:9090:9090" # Prometheus UI, só no host
    networks:
      - observability-net
    restart: unless-stopped

  # Loki - Logs backend
  loki:
    image: grafana/loki:3.7.8
    container_name: loki
    read_only: true
    security_opt:
      - no-new-privileges:true
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki # Chunks, índices e WAL do Loki
    ports:
      - "127.0.0.1:3100:3100" # Loki API, só no host
    networks:
      - observability-net
    restart: unless-stopped

  # Promtail - Envia logs do Docker para o Loki
  promtail:
    image: grafana/promtail:3.6.11
    container_name: promtail
    read_only: true
    security_opt:
      - no-new-privileges:true
    volumes:
      - ../prometheus/promtail-config.yml:/etc/promtail/config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - promtail_positions:/tmp # positions.yaml do Promtail
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - observability-net
    restart: unless-stopped

  # Grafana - Dashboard
  grafana:
    image: grafana/grafana:13.2.3
    container_name: grafana
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp # Arquivos temporários dos plugins de datasource
    environment:
      # Sem isso o Grafana tenta trocar em runtime os plugins embutidos na
      # imagem, falha no rootfs somente leitura e desregistra as datasources
      # Prometheus e Loki.
      - GF_PLUGINS_PREINSTALL_AUTO_UPDATE=false
      # Sem a variável, o Grafana cria o administrador admin com a senha admin
      # na primeira subida. Ela só vale na primeira subida: a senha de uma
      # instância que já existe é trocada com grafana cli admin
      # reset-admin-password.
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?defina GF_SECURITY_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:3000:3000" # Grafana UI, só no host (túnel SSH)
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - observability-net
      - management-net
    restart: unless-stopped

volumes:
  loki_data:
  promtail_positions:
  grafana_data:

networks:
  observability-net:
    external: true
  management-net:
    external: true
