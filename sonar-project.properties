sonar.projectKey=edutrace
sonar.projectName=EduTrace
sonar.projectVersion=1.0

sonar.sources=back/src,front/src
sonar.tests=back/test
sonar.test.inclusions=back/test/**/*.spec.ts,back/src/**/*.spec.ts,front/src/**/*.spec.ts
sonar.exclusions=back/coverage/**,front/.next/**,front/public/**,back/prisma/migrations/**,**/node_modules/**

sonar.javascript.lcov.reportPaths=back/coverage/lcov.info
sonar.typescript.tsconfigPaths=back/tsconfig.json,front/tsconfig.json
sonar.sourceEncoding=UTF-8
