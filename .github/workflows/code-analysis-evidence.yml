name: code-analysis-evidence

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - "back/**"
      - "front/**"
      - ".github/codeql/**"
      - ".github/workflows/code-analysis-evidence.yml"
      - "sonar-project.properties"
      - "back/sonar-project.properties"
      - "front/sonar-project.properties"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

env:
  NODE_VERSION: "24"

jobs:
  codeql:
    name: CodeQL report
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          config-file: ./.github/codeql/codeql-config.yml

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install backend dependencies
        working-directory: ./back
        run: npm ci

      - name: Generate Prisma client
        working-directory: ./back
        run: npx prisma generate

      - name: Build backend
        working-directory: ./back
        run: npm run build

      - name: Install frontend dependencies
        working-directory: ./front
        run: npm ci

      - name: Build frontend
        working-directory: ./front
        env:
          NEXT_PUBLIC_API_EDU_TRACE: http://localhost:3001
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build

      - name: Perform CodeQL analysis
        id: codeql-analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
          output: codeql-results
          upload: always

      - name: Upload CodeQL SARIF evidence
        uses: actions/upload-artifact@v7
        with:
          name: codeql-sarif-report
          path: ${{ steps.codeql-analyze.outputs.sarif-output }}
          if-no-files-found: error
          retention-days: 30

  static-analysis-evidence:
    name: Lint, tests and coverage evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/testdb

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Backend dependencies
        working-directory: ./back
        run: npm ci

      - name: Backend Prisma client
        working-directory: ./back
        run: npx prisma generate

      - name: Backend lint evidence
        working-directory: ./back
        shell: bash
        run: |
          mkdir -p ../analysis-evidence/backend
          npm run lint:check 2>&1 | tee ../analysis-evidence/backend/eslint.log

      - name: Backend test coverage evidence
        working-directory: ./back
        shell: bash
        run: |
          npm run test:cov -- --ci 2>&1 | tee ../analysis-evidence/backend/jest-coverage.log
          cp -r coverage ../analysis-evidence/backend/coverage

      - name: Frontend dependencies
        working-directory: ./front
        run: npm ci

      - name: Frontend lint evidence
        working-directory: ./front
        shell: bash
        run: |
          mkdir -p ../analysis-evidence/frontend
          npm run lint 2>&1 | tee ../analysis-evidence/frontend/eslint.log

      - name: Frontend build evidence
        working-directory: ./front
        env:
          NEXT_PUBLIC_API_EDU_TRACE: http://localhost:3001
          NODE_OPTIONS: --max-old-space-size=4096
        shell: bash
        run: npm run build 2>&1 | tee ../analysis-evidence/frontend/build.log

      - name: Upload static analysis evidence
        uses: actions/upload-artifact@v7
        with:
          name: static-analysis-evidence
          path: analysis-evidence
          if-no-files-found: error
          retention-days: 30

  sonarqube:
    name: SonarQube analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/testdb
      NEXT_PUBLIC_API_EDU_TRACE: http://localhost:3001
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Prepare backend coverage
        working-directory: ./back
        run: |
          npm ci
          npx prisma generate
          npm run test:cov -- --ci

      - name: Prepare frontend build
        working-directory: ./front
        run: |
          npm ci
          npm run build

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || secrets.SONAR_HOST_URL }}

      - name: Upload SonarQube scanner evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sonarqube-scanner-evidence
          path: .scannerwork
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
