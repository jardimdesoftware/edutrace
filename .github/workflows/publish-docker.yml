name: Publish Docker Images

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag"
        required: true
        default: "1.10.3"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout version
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./back
          file: ./back/Dockerfile
          push: true
          tags: |
            ghcr.io/valeriacristinagl/back-edutrace:${{ inputs.version }}
            ghcr.io/valeriacristinagl/back-edutrace:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./front
          file: ./front/Dockerfile
          push: true
          tags: |
            ghcr.io/valeriacristinagl/front-edutrace:${{ inputs.version }}
            ghcr.io/valeriacristinagl/front-edutrace:latest
