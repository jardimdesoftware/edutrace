name: Semgrep CE Security Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "30 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Scan source code
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Semgrep CE
        run: pipx install semgrep==1.177.0

      - name: Run Semgrep
        run: |
          mkdir -p security-reports/semgrep
          semgrep scan \
            --config auto \
            --exclude node_modules \
            --exclude .next \
            --exclude dist \
            --exclude '.env*' \
            --exclude 'docs/security/evidence/**' \
            --json-output security-reports/semgrep/semgrep.json \
            --sarif-output security-reports/semgrep/semgrep.sarif \
            --text-output security-reports/semgrep/semgrep.txt

      - name: Upload SARIF to code scanning
        if: always() && hashFiles('security-reports/semgrep/semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@7999b86c43a865dc79d8923397f35af22de63401 # v4
        with:
          sarif_file: security-reports/semgrep/semgrep.sarif

      - name: Upload Semgrep evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semgrep-evidence
          path: security-reports/semgrep/
          if-no-files-found: error
