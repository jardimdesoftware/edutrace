name: frontend-pipeline

on:
  pull_request:
    types: [closed]
    branches: [ "main" ]
    paths:
      - 'front/**'
      - '.github/workflows/frontend-pipeline.yml'
  workflow_dispatch:
    inputs:
      tipo:
        description: Tipo de mudança que define o incremento da versão
        type: choice
        required: true
        default: bug-fix
        options:
          - bug-fix
          - nova-feature
          - marco-no-projeto

permissions:
  contents: read
  
env:
  IMAGE_NAME: ${{ github.repository_owner }}/${{ github.event.repository.name }}-frontend
  REGISTRY: ghcr.io

jobs:
# --------------------------------------------------------------------
# 1) PREPARE TAG -----------------------------------------------------
# --------------------------------------------------------------------
  prepare-tag:
    name: 1. Preparar nova tag
    runs-on: ubuntu-latest
    # PR fechada sem merge também dispara o evento 'closed' — sem esta
    # condição o pipeline publicaria/deployaria código não mesclado.
    # Os demais jobs dependem deste (needs) e são pulados junto.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    outputs:
      new_tag: ${{ steps.nova_tag.outputs.nova_tag }}
      tipo:    ${{ steps.tipo.outputs.tipo }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar GitHub CLI
        run: sudo apt-get install -y gh

      # Sem tipo definido a versão não é incrementada e a release colide com
      # a tag já existente — o job falha aqui, antes de construir a imagem.
      - name: Extrair tipo de mudança da PR
        id: tipo
        # O corpo da PR entra via env para não ser interpolado no shell
        # (corpos com aspas/crases — ex.: dependabot — quebravam o passo).
        env:
          TIPO_INPUT: ${{ inputs.tipo }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          tipo="$TIPO_INPUT"

          if [[ -z "$tipo" ]]; then
            printf '%s\n' "$PR_BODY" > body.txt

            if grep -q "\[x\] marco-no-projeto" body.txt; then
              tipo="marco-no-projeto"
            elif grep -q "\[x\] nova-feature" body.txt; then
              tipo="nova-feature"
            elif grep -q "\[x\] bug-fix" body.txt; then
              tipo="bug-fix"
            fi
          fi

          # PRs do dependabot não usam o template do repositório e nunca trazem
          # os checkboxes; bump de dependência é incremento de patch.
          if [[ -z "$tipo" && "$PR_AUTHOR" == "dependabot[bot]" ]]; then
            tipo="bug-fix"
          fi

          if [[ -z "$tipo" ]]; then
            echo "Nenhuma opção marcada em 'tipo:' no corpo da PR: marque marco-no-projeto, nova-feature ou bug-fix."
            exit 1
          fi

          echo "tipo=$tipo" >> "$GITHUB_OUTPUT"

      - name: Obter a última tag da release
        id: ultima
        run: |
          gh auth setup-git
          tag=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
          if [[ -z "$tag" ]]; then tag="0.0.0"; fi
          echo "tag_atual=$tag" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcular nova tag
        id: nova_tag
        run: |
          IFS='.' read -r major minor patch <<< "${{ steps.ultima.outputs.tag_atual }}"
          case "${{ steps.tipo.outputs.tipo }}" in
            bug-fix)           patch=$((patch + 1));;
            nova-feature)      minor=$((minor + 1)); patch=0;;
            marco-no-projeto)  major=$((major + 1)); minor=0; patch=0;;
          esac
          nova_tag="${major}.${minor}.${patch}"
          echo "Nova tag: $nova_tag"
          echo "nova_tag=$nova_tag" >> "$GITHUB_OUTPUT"

# --------------------------------------------------------------------
# 2) SONARQUBE ANALYSIS ----------------------------------------------
# --------------------------------------------------------------------
  # build-and-analyze:
  #   name: 2. Build and Analyze
  #   runs-on: ubuntu-latest
  #   needs: prepare-tag
  
  #   steps:
  #     - uses: actions/checkout@v4
  #       with:
  #         fetch-depth: 0
  
  #     - uses: SonarSource/sonarqube-scan-action@v5
  #       env:
  #         SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_FRONT }}
  #         SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
  #       with:
  #         projectBaseDir: front

# --------------------------------------------------------------------
# 3) BUILD DA IMAGEM POR PLATAFORMA ----------------------------------
# --------------------------------------------------------------------
  # O arm64 emulado com QEMU no runner amd64 travava no npm ci ("qemu: uncaught
  # target signal 4 (Illegal instruction)") e o job ficava parado até o limite
  # de 6 h. Cada plataforma builda no runner da própria arquitetura e publica a
  # imagem só pelo digest; as tags saem no job seguinte, com as duas juntas.
  docker-build:
    name: 3. Build da imagem (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [prepare-tag]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      TAG: ${{ needs.prepare-tag.outputs.new_tag }}
      IMAGE_NAME: ${{ github.repository_owner }}/${{ github.event.repository.name }}-frontend
      REGISTRY: ghcr.io

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Validar standalone do Next
        working-directory: front
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          npm ci
          npm run build
          test -f .next/standalone/server.js || (echo "standalone nao encontrado: .next/standalone/server.js" && exit 1)

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login no GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem pelo digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./front
          file: ./front/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=min
          build-args: |
            REPO_URL=${{ github.server_url }}/${{ github.repository }}
            NEXT_PUBLIC_API_EDU_TRACE=${{ secrets.NEXT_PUBLIC_API_EDU_TRACE }}
          labels: |
            org.opencontainers.image.title=EduTrace Frontend
            org.opencontainers.image.description=Frontend do EduTrace
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.TAG }}

      - name: Exportar o digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Enviar o digest para o job de publicação
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-frontend-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

# --------------------------------------------------------------------
# 4) PUBLICAR A IMAGEM MULTI-ARQUITETURA E ESCANEAR -------------------
# --------------------------------------------------------------------
  docker-publish:
    name: 4. Publicar e escanear a imagem
    runs-on: ubuntu-latest
    needs: [prepare-tag, docker-build]
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ needs.prepare-tag.outputs.new_tag }}
      IMAGE_NAME: ${{ github.repository_owner }}/${{ github.event.repository.name }}-frontend
      REGISTRY: ghcr.io

    steps:
      - name: Baixar os digests das plataformas
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-frontend-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login no GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Criar as tags com as duas plataformas
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            -t "$REGISTRY/$IMAGE_NAME:$TAG" \
            -t "$REGISTRY/$IMAGE_NAME:latest" \
            $(printf "$REGISTRY/$IMAGE_NAME@sha256:%s " *)

      - name: Conferir as plataformas publicadas
        run: docker buildx imagetools inspect "$REGISTRY/$IMAGE_NAME:$TAG"

      # Scan Docker image
      - name: Trivy Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

# --------------------------------------------------------------------
# 5) CREATE RELEASE --------------------------------------------------
# --------------------------------------------------------------------
  create-release:
    name: 5. Criar release
    runs-on: ubuntu-latest
    needs: [docker-publish, prepare-tag]
    permissions:
      contents: write
    env:
      NEW_TAG: ${{ needs.prepare-tag.outputs.new_tag }}
      TIPO:    ${{ needs.prepare-tag.outputs.tipo }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    
      - name: Publicar release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.NEW_TAG }}
          name: Release ${{ env.NEW_TAG }}
          generate_release_notes: true
          body: |
            Release gerada automaticamente a partir da Pull Request #${{ github.event.pull_request.number }}
            Tipo de mudança: ${{ env.TIPO }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

