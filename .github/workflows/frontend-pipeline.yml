name: frontend-pipeline

on:
  pull_request:
    types: [closed]
    branches: [ "main" ]
    paths:
      - 'front/**'
  workflow_dispatch:
    inputs:
      tipo:
        description: Tipo de mudança que define o incremento da versão
        type: choice
        required: true
        default: bug-fix
        options:
          - bug-fix
          - nova-feature
          - marco-no-projeto
  
env:
  IMAGE_NAME: front-${{ github.event.repository.name }}
  REGISTRY: ghcr.io

jobs:
# --------------------------------------------------------------------
# 1) PREPARE TAG -----------------------------------------------------
# --------------------------------------------------------------------
  prepare-tag:
    name: 1. Preparar nova tag
    runs-on: ubuntu-latest
    # PR fechada sem merge também dispara o evento 'closed' — sem esta
    # condição o pipeline publicaria/deployaria código não mesclado.
    # Os demais jobs dependem deste (needs) e são pulados junto.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    outputs:
      new_tag: ${{ steps.nova_tag.outputs.nova_tag }}
      tipo:    ${{ steps.tipo.outputs.tipo }}

    steps:
      - uses: actions/checkout@v4

      - name: Instalar GitHub CLI
        run: sudo apt-get install -y gh

      # Sem tipo definido a versão não é incrementada e a release colide com
      # a tag já existente — o job falha aqui, antes de construir a imagem.
      - name: Extrair tipo de mudança da PR
        id: tipo
        # O corpo da PR entra via env para não ser interpolado no shell
        # (corpos com aspas/crases — ex.: dependabot — quebravam o passo).
        env:
          TIPO_INPUT: ${{ inputs.tipo }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          tipo="$TIPO_INPUT"

          if [[ -z "$tipo" ]]; then
            printf '%s\n' "$PR_BODY" > body.txt

            if grep -q "\[x\] marco-no-projeto" body.txt; then
              tipo="marco-no-projeto"
            elif grep -q "\[x\] nova-feature" body.txt; then
              tipo="nova-feature"
            elif grep -q "\[x\] bug-fix" body.txt; then
              tipo="bug-fix"
            fi
          fi

          if [[ -z "$tipo" ]]; then
            echo "Nenhuma opção marcada em 'tipo:' no corpo da PR: marque marco-no-projeto, nova-feature ou bug-fix."
            exit 1
          fi

          echo "tipo=$tipo" >> "$GITHUB_OUTPUT"

      - name: Obter a última tag da release
        id: ultima
        run: |
          gh auth setup-git
          tag=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
          if [[ -z "$tag" ]]; then tag="0.0.0"; fi
          echo "tag_atual=$tag" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcular nova tag
        id: nova_tag
        run: |
          IFS='.' read -r major minor patch <<< "${{ steps.ultima.outputs.tag_atual }}"
          case "${{ steps.tipo.outputs.tipo }}" in
            bug-fix)           patch=$((patch + 1));;
            nova-feature)      minor=$((minor + 1)); patch=0;;
            marco-no-projeto)  major=$((major + 1)); minor=0; patch=0;;
          esac
          nova_tag="${major}.${minor}.${patch}"
          echo "Nova tag: $nova_tag"
          echo "nova_tag=$nova_tag" >> "$GITHUB_OUTPUT"

# --------------------------------------------------------------------
# 2) SONARQUBE ANALYSIS ----------------------------------------------
# --------------------------------------------------------------------
  # build-and-analyze:
  #   name: 2. Build and Analyze
  #   runs-on: ubuntu-latest
  #   needs: prepare-tag
  
  #   steps:
  #     - uses: actions/checkout@v4
  #       with:
  #         fetch-depth: 0
  
  #     - uses: SonarSource/sonarqube-scan-action@v5
  #       env:
  #         SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_FRONT }}
  #         SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
  #       with:
  #         projectBaseDir: front

# --------------------------------------------------------------------
# 3) BUILD, SCAN & PUSH DOCKER IMAGE ---------------------------------
# --------------------------------------------------------------------
  docker-build-scan-push:
    name: 3. Build, Scan and Push Docker Image
    runs-on: ubuntu-latest
    needs: [prepare-tag]
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ needs.prepare-tag.outputs.new_tag }}
      IMAGE_NAME: front-${{ github.event.repository.name }}
      REGISTRY: ghcr.io

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validar standalone do Next
        working-directory: front
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          npm ci
          npm run build
          test -f .next/standalone/server.js || (echo "standalone nao encontrado: .next/standalone/server.js" && exit 1)

      # Build Docker image
      - name: Injetar label de source no Dockerfile
        run: |
          echo "LABEL org.opencontainers.image.source=https://github.com/${{ github.repository }}" >> front/Dockerfile

      - name: Build Docker image
        run: |
          docker build ./front \
            -f front/Dockerfile \
            -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ env.TAG }} \
            --build-arg REPO_URL="https://github.com/${{ github.repository }}" \
            --build-arg NEXT_PUBLIC_API_EDU_TRACE="${{ secrets.NEXT_PUBLIC_API_EDU_TRACE }}"

      # Scan Docker image
      - name: Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

      - name: Tag image as latest
        run: |
          docker tag ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ env.TAG }} ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest

      # Push Docker image (desabilitado temporariamente - sem deploy automático)
      # - name: Login no GHCR
      #   run: |
      #     TOKEN="${{ secrets.GHCR_PAT }}"
      #     if [ -z "$TOKEN" ]; then TOKEN="${{ secrets.GITHUB_TOKEN }}"; fi
      #     echo "$TOKEN" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
      #
      # - name: Push Docker image
      #   run: |
      #     docker push ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}
      #     docker push ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest

# --------------------------------------------------------------------
# 4) CREATE RELEASE --------------------------------------------------
# --------------------------------------------------------------------
  create-release:
    name: 4. Criar release
    runs-on: ubuntu-latest
    needs: [docker-build-scan-push, prepare-tag]
    permissions:
      contents: write
    env:
      NEW_TAG: ${{ needs.prepare-tag.outputs.new_tag }}
      TIPO:    ${{ needs.prepare-tag.outputs.tipo }}
    steps:
      - uses: actions/checkout@v4
    
      - name: Publicar release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.NEW_TAG }}
          name: Release ${{ env.NEW_TAG }}
          generate_release_notes: true
          body: |
            Release gerada automaticamente a partir da Pull Request #${{ github.event.pull_request.number }}
            Tipo de mudança: ${{ env.TIPO }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

