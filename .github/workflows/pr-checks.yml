name: pr-checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - 'back/**'
      - 'front/**'
      - 'docker-compose-dev.yml'
      - 'docker-compose-prod.yml'
      - '.env.development.example'
      - '.env.production.example'
      - '.github/workflows/pr-checks.yml'
  workflow_dispatch:

env:
  NODE_VERSION: '24'

jobs:
  changes:
    name: Detectar mudanças
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      deploy_config: ${{ steps.filter.outputs.deploy_config }}
    steps:
      - uses: actions/checkout@v4

      - name: Filtrar caminhos alterados
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'back/**'
              - '.github/workflows/pr-checks.yml'
            frontend:
              - 'front/**'
              - '.github/workflows/pr-checks.yml'
            deploy_config:
              - 'docker-compose-dev.yml'
              - 'docker-compose-prod.yml'
              - '.env.development.example'
              - '.env.production.example'
              - 'front/src/middleware.ts'
              - '.github/workflows/pr-checks.yml'

# --------------------------------------------------------------------
# BACKEND TESTS ------------------------------------------------------
# --------------------------------------------------------------------
  backend-tests:
    name: Backend – Testes (Jest)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true' }}
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/testdb

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: back/package-lock.json

      - name: Instalar dependências
        working-directory: ./back
        run: npm ci

      - name: Gerar cliente Prisma
        working-directory: ./back
        run: npx prisma generate

      # Verifica a formatação sem corrigir: o script lint do backend roda com
      # --fix e sairia com sucesso depois de reescrever os arquivos, o que
      # esconderia a divergência em vez de barrar o PR.
      - name: Lint do backend
        working-directory: ./back
        run: npm run lint:check

      # Compila o projeto (nest build / tsc). Garante que erros de tipo
      # e de geração do Prisma Client quebrem o PR (ex.: upgrade do Prisma v7).
      - name: Build do backend
        working-directory: ./back
        run: npm run build

      - name: Rodar testes
        working-directory: ./back
        run: npm test -- --ci

      # Aplica as migrations no banco de teste antes do smoke test do seed.
      - name: Aplicar migrations
        working-directory: ./back
        run: npx prisma migrate deploy

      # Smoke test do seed: garante que `prisma db seed` continua funcionando.
      # Cobre regressões do Prisma v7 como: config do seed migrada para
      # prisma.config.ts e PrismaClient exigindo driver adapter.
      - name: Smoke test do seed
        working-directory: ./back
        env:
          ADMIN_PASSWORD: admin123
        run: |
          npm run seed 2>&1 | tee seed-output.log
          if ! grep -q "Seed concluída" seed-output.log; then
            echo "❌ O seed não foi executado com sucesso."
            echo "   Verifique a config do seed em prisma.config.ts e o driver adapter em prisma/seed.ts."
            exit 1
          fi
          echo "✅ Seed executado com sucesso."

# --------------------------------------------------------------------
# BACKEND DOCKER BUILD -----------------------------------------------
# --------------------------------------------------------------------
  backend-docker-build:
    name: Backend – Build da imagem Docker
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true' }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # Builda a imagem exatamente como em produção. Reproduz a ordem do
      # Dockerfile (prisma generate -> nest build) e pega regressões que só
      # aparecem no build do container, não nos testes unitários.
      - name: Build da imagem Docker do backend
        run: docker build ./back -f back/Dockerfile -t edutrace-back:pr-check

# --------------------------------------------------------------------
# FRONTEND LINT + BUILD ----------------------------------------------
# --------------------------------------------------------------------
  frontend-checks:
    name: Frontend – Lint + Build
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true' }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: Instalar dependências
        working-directory: ./front
        run: npm ci

      - name: Lint
        working-directory: ./front
        run: npm run lint

      - name: Build
        working-directory: ./front
        env:
          NEXT_PUBLIC_API_EDU_TRACE: http://localhost:3001
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build

# --------------------------------------------------------------------
# CONFIG – URL INTERNA DA API ----------------------------------------
# --------------------------------------------------------------------
  internal-api-url-check:
    name: Config – URL interna da API no front
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.deploy_config == 'true' }}
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      # O middleware do front verifica a sessão chamando o backend a partir do
      # servidor Next, que roda dentro do container. Com o endereço publicado no
      # host, esse fetch falha e toda rota protegida devolve 307 para a tela de
      # login, sem erro visível no navegador. O endereço server-side precisa ser
      # o do serviço na rede do compose.
      - name: Verificar INTERNAL_API_URL nos composes e nos exemplos de ambiente
        run: |
          status=0

          for arquivo in docker-compose-dev.yml docker-compose-prod.yml; do
            if ! grep -qF 'INTERNAL_API_URL=${INTERNAL_API_URL}' "$arquivo"; then
              echo "❌ $arquivo não repassa INTERNAL_API_URL ao serviço do front."
              status=1
            fi
          done

          for arquivo in .env.development.example .env.production.example; do
            valor=$(grep -E '^INTERNAL_API_URL=' "$arquivo" | head -1 | cut -d= -f2-)

            if [ -z "$valor" ]; then
              echo "❌ $arquivo não define INTERNAL_API_URL."
              status=1
              continue
            fi

            case "$valor" in
              *localhost*|*127.0.0.1*)
                echo "❌ $arquivo define INTERNAL_API_URL como $valor."
                echo "   Dentro do container do front, localhost é o próprio front."
                echo "   Use o host do serviço na rede do compose, ex.: http://nest-app:3000."
                status=1
                ;;
            esac
          done

          if ! grep -q 'process.env.INTERNAL_API_URL' front/src/middleware.ts; then
            echo "❌ front/src/middleware.ts não lê INTERNAL_API_URL."
            status=1
          fi

          if [ "$status" -ne 0 ]; then
            exit 1
          fi

          echo "✅ INTERNAL_API_URL configurada para a rede interna."

# --------------------------------------------------------------------
# CONFIG – SERVIÇO DO FRONT NO COMPOSE DE PRODUÇÃO --------------------
# --------------------------------------------------------------------
  frontend-service-check:
    name: Config – Serviço do front no compose de produção
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.deploy_config == 'true' }}
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      # Renderiza o compose com uma porta de host diferente de 3000. É esse
      # cenário que separa uma configuração correta de uma que só funciona por
      # coincidência: o Next precisa escutar na porta de destino do mapeamento,
      # e não na porta publicada no host.
      - name: Verificar imagem e porta do serviço do front
        run: |
          status=0

          cat > ci.env <<'VARS'
          PORT_MACHINE_FRONTEND=8080
          PORT_MACHINE_BACKEND=3001
          PORT_MACHINE_DB=5432
          POSTGRES_USER=ci
          POSTGRES_PASSWORD=ci
          POSTGRES_DB=ci
          DATABASE_URL=postgresql://ci:ci@postgres-db:5432/ci
          NODE_ENV=production
          SECRET_KEY=ci
          FRONTEND_URL=http://localhost:8080
          ADMIN_PASSWORD=ci
          SMTP_HOST=ci
          SMTP_PORT=587
          SMTP_USER=ci
          SMTP_PASS=ci
          MAIL_FROM=ci
          API_URL=https://api.exemplo
          NEXT_PUBLIC_API_EDU_TRACE=https://api.exemplo
          INTERNAL_API_URL=http://nest-app:3000
          CLARITY_PROJECT_ID=off
          VARS

          docker compose --env-file ci.env -f docker-compose-prod.yml config --format json > compose.json

          leia() {
            python3 -c "import json,sys; s=json.load(open('compose.json'))['services']['next-app']; print($1)"
          }

          imagem=$(leia "s['image']")
          porta=$(leia "s['environment']['PORT']")
          destino=$(leia "s['ports'][0]['target']")

          # A imagem precisa ser a que o frontend-pipeline publica e que o
          # deploy consome. Apontar para outro repositório entrega uma versão
          # que este projeto não constrói.
          esperada="ghcr.io/jardimdesoftware/edutrace-frontend:latest"
          if [ "$imagem" != "$esperada" ]; then
            echo "❌ docker-compose-prod.yml usa a imagem $imagem."
            echo "   O frontend-pipeline publica $esperada."
            status=1
          fi

          if [ "$porta" != "$destino" ]; then
            echo "❌ O serviço do front escuta na porta $porta, e o mapeamento entrega em $destino."
            echo "   O contêiner sobe, mas a porta publicada não alcança o servidor."
            status=1
          fi

          if [ "$status" -ne 0 ]; then
            exit 1
          fi

          echo "✅ Serviço do front aponta para $imagem e escuta em $destino."
