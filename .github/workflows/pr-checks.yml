name: pr-checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - 'back/**'
      - 'front/**'
      - 'docker-compose-dev.yml'
      - 'docker-compose-prod.yml'
      - '.env.development.example'
      - '.env.production.example'
      - '.github/workflows/pr-checks.yml'
      - '.github/workflows/**'
      - '.github/dependabot.yml'
  workflow_dispatch:

env:
  NODE_VERSION: '24'

jobs:
  changes:
    name: Detectar mudanças
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      deploy_config: ${{ steps.filter.outputs.deploy_config }}
      ci_config: ${{ steps.filter.outputs.ci_config }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Filtrar caminhos alterados
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            backend:
              - 'back/**'
              - '.github/workflows/pr-checks.yml'
            frontend:
              - 'front/**'
              - '.github/workflows/pr-checks.yml'
            deploy_config:
              - 'docker-compose-dev.yml'
              - 'docker-compose-prod.yml'
              - '.env.development.example'
              - '.env.production.example'
              - 'front/src/middleware.ts'
              - '.github/workflows/pr-checks.yml'
            ci_config:
              - '.github/workflows/**'
              - '.github/dependabot.yml'

# --------------------------------------------------------------------
# BACKEND TESTS ------------------------------------------------------
# --------------------------------------------------------------------
  backend-tests:
    name: Backend – Testes (Jest)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true' }}
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/testdb

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: back/package-lock.json

      - name: Instalar dependências
        working-directory: ./back
        run: npm ci

      - name: Gerar cliente Prisma
        working-directory: ./back
        run: npx prisma generate

      # Verifica a formatação sem corrigir: o script lint do backend roda com
      # --fix e sairia com sucesso depois de reescrever os arquivos, o que
      # esconderia a divergência em vez de barrar o PR.
      - name: Lint do backend
        working-directory: ./back
        run: npm run lint:check

      # Compila o projeto (nest build / tsc). Garante que erros de tipo
      # e de geração do Prisma Client quebrem o PR (ex.: upgrade do Prisma v7).
      - name: Build do backend
        working-directory: ./back
        run: npm run build

      - name: Rodar testes
        working-directory: ./back
        run: npm test -- --ci

      # Aplica as migrations no banco de teste antes do smoke test do seed.
      - name: Aplicar migrations
        working-directory: ./back
        run: npx prisma migrate deploy

      # Smoke test do seed: garante que `prisma db seed` continua funcionando.
      # Cobre regressões do Prisma v7 como: config do seed migrada para
      # prisma.config.ts e PrismaClient exigindo driver adapter.
      - name: Smoke test do seed
        working-directory: ./back
        env:
          ADMIN_PASSWORD: admin123
        run: |
          npm run seed 2>&1 | tee seed-output.log
          if ! grep -q "Seed concluída" seed-output.log; then
            echo "❌ O seed não foi executado com sucesso."
            echo "   Verifique a config do seed em prisma.config.ts e o driver adapter em prisma/seed.ts."
            exit 1
          fi
          echo "✅ Seed executado com sucesso."

# --------------------------------------------------------------------
# BACKEND DOCKER BUILD -----------------------------------------------
# --------------------------------------------------------------------
  backend-docker-build:
    name: Backend – Build da imagem Docker
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true' }}
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Builda a imagem exatamente como em produção. Reproduz a ordem do
      # Dockerfile (prisma generate -> nest build) e pega regressões que só
      # aparecem no build do container, não nos testes unitários.
      - name: Build da imagem Docker do backend
        run: docker build ./back -f back/Dockerfile -t edutrace-back:pr-check

      # A imagem roda sem root e os arquivos dela continuam do root, então o
      # processo não consegue reescrever o próprio código. O CMD (migrations,
      # seed e start) precisa continuar funcionando assim, por isso o container
      # sobe de verdade contra o PostgreSQL do job.
      - name: Verificar que o container do backend sobe sem root
        run: |
          uid=$(docker run --rm --entrypoint id edutrace-back:pr-check -u)
          if [ "$uid" = "0" ]; then
            echo "ERRO: a imagem do backend roda como root."
            echo "   Declare USER node no back/Dockerfile antes do CMD."
            exit 1
          fi

          docker run -d --name backend-pr-check --network host \
            -e PORT=3000 \
            -e DATABASE_URL=postgresql://test:test@localhost:5432/testdb \
            -e NODE_ENV=production \
            -e SECRET_KEY="$(openssl rand -hex 32)" \
            -e FRONTEND_URL=http://localhost:3001 \
            -e ADMIN_PASSWORD=admin123 \
            edutrace-back:pr-check

          status=000
          for tentativa in $(seq 1 60); do
            status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/auth/profile || true)
            if [ "$status" != "000" ] || [ "$(docker inspect -f '{{.State.Running}}' backend-pr-check)" != "true" ]; then
              break
            fi
            sleep 2
          done

          docker logs backend-pr-check

          # Rota protegida: 401 prova que migrations, seed e bootstrap passaram.
          if [ "$status" != "401" ]; then
            echo "ERRO: o container do backend não subiu sem root (HTTP $status em /auth/profile)."
            exit 1
          fi

          if docker exec backend-pr-check touch dist/src/main.js 2>/dev/null; then
            echo "ERRO: o processo do backend consegue reescrever o código da imagem."
            exit 1
          fi

          echo "OK: o backend roda com UID $uid, sobe com migrations e seed e não altera o próprio código."

# --------------------------------------------------------------------
# FRONTEND LINT + BUILD ----------------------------------------------
# --------------------------------------------------------------------
  frontend-checks:
    name: Frontend – Lint + Build
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true' }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: Instalar dependências
        working-directory: ./front
        run: npm ci

      - name: Lint
        working-directory: ./front
        run: npm run lint

      - name: Testes
        working-directory: ./front
        run: npm test

      - name: Build
        working-directory: ./front
        env:
          NEXT_PUBLIC_API_EDU_TRACE: http://localhost:3001
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build

# --------------------------------------------------------------------
# FRONTEND DOCKER BUILD ----------------------------------------------
# --------------------------------------------------------------------
  frontend-docker-build:
    name: "Frontend: Build da imagem Docker"
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true' }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build da imagem Docker do frontend
        run: docker build ./front -f front/Dockerfile -t edutrace-front:pr-check

      # O servidor roda sem root. Só o runtime-config.js, que o entrypoint
      # reescreve a cada start, e o cache do otimizador do next/image pertencem
      # ao usuário do processo; o resto da imagem continua do root.
      - name: Verificar que o container do frontend sobe sem root
        run: |
          uid=$(docker run --rm --entrypoint id edutrace-front:pr-check -u)
          if [ "$uid" = "0" ]; then
            echo "ERRO: a imagem do frontend roda como root."
            echo "   Declare USER node no front/Dockerfile antes do ENTRYPOINT."
            exit 1
          fi

          docker run -d --name frontend-pr-check -p 3000:3000 \
            -e API_URL=https://api.exemplo \
            -e CLARITY_PROJECT_ID=off \
            edutrace-front:pr-check

          status=000
          for tentativa in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/login || true)
            if [ "$status" != "000" ] || [ "$(docker inspect -f '{{.State.Running}}' frontend-pr-check)" != "true" ]; then
              break
            fi
            sleep 2
          done

          docker logs frontend-pr-check

          if [ "$status" != "200" ]; then
            echo "ERRO: o container do frontend não subiu sem root (HTTP $status em /login)."
            exit 1
          fi

          if ! docker exec frontend-pr-check grep -qF 'API_URL = "https://api.exemplo"' /app/public/runtime-config.js; then
            echo "ERRO: o entrypoint não conseguiu gravar /app/public/runtime-config.js."
            exit 1
          fi

          imagem=$(curl -s -o /dev/null -w '%{http_code}' 'http://localhost:3000/_next/image?url=%2Ficon.png&w=64&q=75' || true)
          if [ "$imagem" != "200" ]; then
            echo "ERRO: o otimizador do next/image falhou sem root (HTTP $imagem)."
            exit 1
          fi

          if docker exec frontend-pr-check touch /app/server.js 2>/dev/null; then
            echo "ERRO: o processo do frontend consegue reescrever o código da imagem."
            exit 1
          fi

          echo "OK: o frontend roda com UID $uid, grava a config de runtime e não altera o próprio código."

# --------------------------------------------------------------------
# CONFIG – URL INTERNA DA API ----------------------------------------
# --------------------------------------------------------------------
  internal-api-url-check:
    name: Config – URL interna da API no front
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.deploy_config == 'true' }}
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # O middleware do front verifica a sessão chamando o backend a partir do
      # servidor Next, que roda dentro do container. Com o endereço publicado no
      # host, esse fetch falha e toda rota protegida devolve 307 para a tela de
      # login, sem erro visível no navegador. O endereço server-side precisa ser
      # o do serviço na rede do compose.
      - name: Verificar INTERNAL_API_URL nos composes e nos exemplos de ambiente
        run: |
          status=0

          for arquivo in docker-compose-dev.yml docker-compose-prod.yml; do
            if ! grep -qF 'INTERNAL_API_URL=${INTERNAL_API_URL}' "$arquivo"; then
              echo "❌ $arquivo não repassa INTERNAL_API_URL ao serviço do front."
              status=1
            fi
          done

          for arquivo in .env.development.example .env.production.example; do
            valor=$(grep -E '^INTERNAL_API_URL=' "$arquivo" | head -1 | cut -d= -f2-)

            if [ -z "$valor" ]; then
              echo "❌ $arquivo não define INTERNAL_API_URL."
              status=1
              continue
            fi

            case "$valor" in
              *localhost*|*127.0.0.1*)
                echo "❌ $arquivo define INTERNAL_API_URL como $valor."
                echo "   Dentro do container do front, localhost é o próprio front."
                echo "   Use o host do serviço na rede do compose, ex.: http://nest-app:3000."
                status=1
                ;;
            esac
          done

          if ! grep -q 'process.env.INTERNAL_API_URL' front/src/middleware.ts; then
            echo "❌ front/src/middleware.ts não lê INTERNAL_API_URL."
            status=1
          fi

          if [ "$status" -ne 0 ]; then
            exit 1
          fi

          echo "✅ INTERNAL_API_URL configurada para a rede interna."

# --------------------------------------------------------------------
# CONFIG – SERVIÇO DO FRONT NO COMPOSE DE PRODUÇÃO --------------------
# --------------------------------------------------------------------
  frontend-service-check:
    name: Config – Serviço do front no compose de produção
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.deploy_config == 'true' }}
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Renderiza o compose com uma porta de host diferente de 3000. É esse
      # cenário que separa uma configuração correta de uma que só funciona por
      # coincidência: o Next precisa escutar na porta de destino do mapeamento,
      # e não na porta publicada no host.
      - name: Verificar imagem e porta do serviço do front
        run: |
          status=0

          cat > ci.env <<'VARS'
          PORT_MACHINE_FRONTEND=8080
          PORT_MACHINE_BACKEND=3001
          POSTGRES_USER=ci
          POSTGRES_PASSWORD=ci
          POSTGRES_DB=ci
          DATABASE_URL=postgresql://ci:ci@postgres-db:5432/ci
          NODE_ENV=production
          SECRET_KEY=ci
          FRONTEND_URL=http://localhost:8080
          ADMIN_PASSWORD=ci
          SMTP_HOST=ci
          SMTP_PORT=587
          SMTP_USER=ci
          SMTP_PASS=ci
          MAIL_FROM=ci
          API_URL=https://api.exemplo
          NEXT_PUBLIC_API_EDU_TRACE=https://api.exemplo
          INTERNAL_API_URL=http://nest-app:3000
          CLARITY_PROJECT_ID=off
          VARS

          docker compose --env-file ci.env -f docker-compose-prod.yml config --format json > compose.json

          leia() {
            python3 -c "import json,sys; s=json.load(open('compose.json'))['services']['next-app']; print($1)"
          }

          imagem=$(leia "s['image']")
          imagem_backend=$(python3 -c "import json; s=json.load(open('compose.json'))['services']['nest-app']; print(s['image'])")
          porta=$(leia "s['environment']['PORT']")
          destino=$(leia "s['ports'][0]['target']")

          # A imagem precisa ser a que o frontend-pipeline publica e que o
          # deploy consome. Apontar para outro repositório entrega uma versão
          # que este projeto não constrói.
          esperada="ghcr.io/jardimdesoftware/edutrace-frontend:latest"
          if [ "$imagem" != "$esperada" ]; then
            echo "❌ docker-compose-prod.yml usa a imagem $imagem."
            echo "   O frontend-pipeline publica $esperada."
            status=1
          fi

          esperada_backend="ghcr.io/jardimdesoftware/edutrace-backend:latest"
          if [ "$imagem_backend" != "$esperada_backend" ]; then
            echo "docker-compose-prod.yml usa a imagem de backend $imagem_backend."
            echo "O backend-pipeline publica $esperada_backend."
            status=1
          fi

          if [ "$porta" != "$destino" ]; then
            echo "❌ O serviço do front escuta na porta $porta, e o mapeamento entrega em $destino."
            echo "   O contêiner sobe, mas a porta publicada não alcança o servidor."
            status=1
          fi

          if [ "$status" -ne 0 ]; then
            exit 1
          fi

          echo "✅ Serviço do front aponta para $imagem e escuta em $destino."

# --------------------------------------------------------------------
# CONFIG – PORTA DO POSTGRESQL NO COMPOSE DE PRODUÇÃO -----------------
# --------------------------------------------------------------------
  database-port-check:
    name: Config – Porta do PostgreSQL no compose de produção
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.deploy_config == 'true' }}
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # O back alcança o banco pelo nome do serviço na rede app-net, então o
      # PostgreSQL não precisa de porta no host. Porta publicada abre o banco em
      # todas as interfaces, e as regras de iptables do Docker passam por cima do
      # firewall do host. PORT_MACHINE_DB continua definida aqui para que um
      # mapeamento "${PORT_MACHINE_DB}:5432" devolvido ao compose apareça na
      # renderização e reprove o job.
      - name: Verificar que o PostgreSQL não publica porta no host
        run: |
          cat > ci.env <<'VARS'
          PORT_MACHINE_FRONTEND=8080
          PORT_MACHINE_BACKEND=3001
          PORT_MACHINE_DB=5432
          POSTGRES_USER=ci
          POSTGRES_PASSWORD=ci
          POSTGRES_DB=ci
          DATABASE_URL=postgresql://ci:ci@postgres-db:5432/ci
          NODE_ENV=production
          SECRET_KEY=ci
          FRONTEND_URL=http://localhost:8080
          ADMIN_PASSWORD=ci
          SMTP_HOST=ci
          SMTP_PORT=587
          SMTP_USER=ci
          SMTP_PASS=ci
          MAIL_FROM=ci
          GOOGLE_CLIENT_ID=ci
          API_URL=https://api.exemplo
          NEXT_PUBLIC_API_EDU_TRACE=https://api.exemplo
          INTERNAL_API_URL=http://nest-app:3000
          CLARITY_PROJECT_ID=off
          VARS

          docker compose --env-file ci.env -f docker-compose-prod.yml config --format json > compose.json

          quantidade=$(python3 -c "import json; s=json.load(open('compose.json'))['services']['postgres-db']; print(len(s.get('ports', [])))")

          if [ "$quantidade" -ne 0 ]; then
            echo "ERRO: docker-compose-prod.yml publica $quantidade porta(s) do PostgreSQL no host."
            echo "   O back conecta por postgres-db:5432 na rede app-net; remova o bloco ports do serviço postgres-db."
            exit 1
          fi

          echo "OK: o PostgreSQL do compose de produção não publica porta no host."

# --------------------------------------------------------------------
# CONFIG: DEPENDÊNCIAS DO CI -----------------------------------------
# --------------------------------------------------------------------
  ci-dependencies-check:
    name: "Config: Dependências do CI"
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.ci_config == 'true' }}
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Tag e branch de action são referências móveis: quem controla o
      # repositório da action pode repontá-las para outro código, que passa a
      # rodar com os segredos e o GITHUB_TOKEN do workflow. Só o SHA completo do
      # commit é imutável. Referências locais (./) e imagens (docker://) não
      # passam por essa verificação.
      - name: Verificar que toda action está fixada por SHA
        run: |
          sem_sha=$(grep -rnHE --include='*.yml' --include='*.yaml' '^[[:space:]]*(-[[:space:]]+)?uses:' .github/workflows \
            | grep -vE 'uses:[[:space:]]*(\./|docker://)' \
            | grep -vE '@[0-9a-f]{40}([[:space:]]|$)' || true)

          if [ -n "$sem_sha" ]; then
            echo "ERRO: actions referenciadas por tag ou branch, que podem ser repontadas:"
            echo "$sem_sha"
            echo "   Use o SHA completo do commit, com a versão em comentário: uses: dono/action@<sha> # vX"
            exit 1
          fi

          echo "OK: todas as actions dos workflows estão fixadas por SHA."

      # Versão recém-publicada é a janela em que um release malicioso ainda não
      # foi detectado e retirado do registro. O cooldown atrasa só as version
      # updates; as atualizações de segurança do Dependabot continuam imediatas.
      - name: Verificar cooldown do Dependabot
        run: |
          sem_cooldown=$(yq '.updates[] | select((.cooldown."default-days" // 0) < 7) | ."package-ecosystem" + " em " + .directory' .github/dependabot.yml)

          if [ -n "$sem_cooldown" ]; then
            echo "ERRO: entradas do Dependabot sem cooldown de pelo menos 7 dias:"
            echo "$sem_cooldown"
            echo "   Adicione cooldown.default-days: 7 (ou mais) a cada package-ecosystem."
            exit 1
          fi

          echo "OK: todas as entradas do Dependabot têm cooldown de pelo menos 7 dias."
