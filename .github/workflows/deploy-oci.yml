name: Deploy latest images to OCI

on:
  workflow_run:
    workflows:
      - backend-pipeline
      - frontend-pipeline
    types:
      - completed
  workflow_dispatch:
    inputs:
      component:
        description: Component to deploy
        required: true
        default: all
        type: choice
        options:
          - all
          - backend
          - frontend
          - nginx

concurrency:
  group: edutrace-oci-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to OCI production
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OCI_HOST: ${{ secrets.OCI_HOST }}
      OCI_USER: ${{ secrets.OCI_USER }}
      OCI_SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
      OCI_SSH_KNOWN_HOSTS: ${{ secrets.OCI_SSH_KNOWN_HOSTS }}

    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail

          for variable in OCI_HOST OCI_USER OCI_SSH_PRIVATE_KEY OCI_SSH_KNOWN_HOSTS; do
            if [[ -z "${!variable:-}" ]]; then
              echo "Required secret ${variable} is not configured." >&2
              exit 1
            fi
          done

          install -m 700 -d "${RUNNER_TEMP}/ssh"
          printf '%s\n' "${OCI_SSH_PRIVATE_KEY}" > "${RUNNER_TEMP}/ssh/oci_key"
          printf '%s\n' "${OCI_SSH_KNOWN_HOSTS}" > "${RUNNER_TEMP}/ssh/known_hosts"
          chmod 600 "${RUNNER_TEMP}/ssh/oci_key" "${RUNNER_TEMP}/ssh/known_hosts"

      - name: Hide host nginx version
        if: >-
          github.event_name == 'workflow_run' ||
          inputs.component == 'nginx' ||
          inputs.component == 'all'
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            -i "${RUNNER_TEMP}/ssh/oci_key" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${RUNNER_TEMP}/ssh/known_hosts" \
            "${OCI_USER}@${OCI_HOST}" \
            'flock -w 120 /tmp/edutrace-nginx.lock sudo -n bash -se' <<'REMOTE'
          set -euo pipefail

          config=/etc/nginx/nginx.conf
          backup="${config}.before-server-tokens-$(date +%Y%m%d%H%M%S)"
          cp -a "$config" "$backup"

          if grep -Eq '^[[:space:]]*server_tokens[[:space:]]+[^;]+;' "$config"; then
            sed -Ei 's/^[[:space:]]*server_tokens[[:space:]]+[^;]+;/    server_tokens off;/' "$config"
          else
            sed -Ei '/^[[:space:]]*http[[:space:]]*\{/a\    server_tokens off;' "$config"
          fi

          if ! nginx -t; then
            cp -a "$backup" "$config"
            nginx -t
            exit 1
          fi

          systemctl reload nginx
          REMOTE

          server_header="$(curl --silent --show-error --head --max-time 15 \
            https://edutrace.ruancarvalho.me/ \
            | awk 'BEGIN { IGNORECASE=1 } /^server:/ { sub(/\r$/, ""); sub(/^[^:]+:[[:space:]]*/, ""); print; exit }')"
          test "$server_header" = nginx || {
            echo "Unexpected Server header: ${server_header:-missing}" >&2
            exit 1
          }

      - name: Deploy backend image
        if: >-
          (github.event_name == 'workflow_run' && github.event.workflow_run.name == 'backend-pipeline') ||
          (github.event_name == 'workflow_dispatch' && (inputs.component == 'backend' || inputs.component == 'all'))
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            -i "${RUNNER_TEMP}/ssh/oci_key" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${RUNNER_TEMP}/ssh/known_hosts" \
            "${OCI_USER}@${OCI_HOST}" \
            'flock -w 900 /tmp/oci-app-deploy.lock bash -se' <<'REMOTE'
          set -euo pipefail

          cd /opt/edutrace/app
          compose=(docker compose -p app --env-file .env.production -f docker-compose-prod.yml)
          image='ghcr.io/jardimdesoftware/edutrace-backend:latest'
          container='nest-backend'
          service='nest-app'
          previous_image=$(docker inspect --format '{{.Image}}' "${container}")

          rollback() {
            echo 'Backend healthcheck failed; restoring the previous image.' >&2
            docker image tag "${previous_image}" "${image}"
            "${compose[@]}" up -d --no-deps --force-recreate "${service}"
          }

          "${compose[@]}" pull "${service}"
          if ! "${compose[@]}" up -d --no-deps "${service}"; then
            rollback
            exit 1
          fi

          healthy=0
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --max-time 10 \
              https://edutrace.ruancarvalho.me/api/ >/dev/null; then
              healthy=1
              break
            fi
            echo "Backend healthcheck attempt ${attempt}/18 failed; retrying."
            sleep 10
          done

          if [[ "${healthy}" -ne 1 ]]; then
            rollback
            exit 1
          fi

          docker image prune -f
          docker inspect --format='Deployed backend image: {{.Config.Image}} ({{.Image}})' "${container}"
          REMOTE

      - name: Deploy frontend image
        if: >-
          (github.event_name == 'workflow_run' && github.event.workflow_run.name == 'frontend-pipeline') ||
          (github.event_name == 'workflow_dispatch' && (inputs.component == 'frontend' || inputs.component == 'all'))
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            -i "${RUNNER_TEMP}/ssh/oci_key" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${RUNNER_TEMP}/ssh/known_hosts" \
            "${OCI_USER}@${OCI_HOST}" \
            'flock -w 900 /tmp/oci-app-deploy.lock bash -se' <<'REMOTE'
          set -euo pipefail

          cd /opt/edutrace/app
          compose=(docker compose -p app --env-file .env.production -f docker-compose-prod.yml)
          image='ghcr.io/jardimdesoftware/edutrace-frontend:latest'
          container='next-frontend'
          service='next-app'
          previous_image=$(docker inspect --format '{{.Image}}' "${container}")

          rollback() {
            echo 'Frontend healthcheck failed; restoring the previous image.' >&2
            docker image tag "${previous_image}" "${image}"
            "${compose[@]}" up -d --no-deps --force-recreate "${service}"
          }

          "${compose[@]}" pull "${service}"
          if ! "${compose[@]}" up -d --no-deps "${service}"; then
            rollback
            exit 1
          fi

          healthy=0
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --max-time 10 \
              https://edutrace.ruancarvalho.me/ >/dev/null; then
              healthy=1
              break
            fi
            echo "Frontend healthcheck attempt ${attempt}/18 failed; retrying."
            sleep 10
          done

          if [[ "${healthy}" -ne 1 ]]; then
            rollback
            exit 1
          fi

          docker image prune -f
          docker inspect --format='Deployed frontend image: {{.Config.Image}} ({{.Image}})' "${container}"
          REMOTE
