global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: edutrace-api
    metrics_path: /metrics
    static_configs:
      - targets: ["nest-app:3000"]
  - job_name: containers
    static_configs:
      - targets: ["cadvisor:8080"]
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
