services:
  next-app:
    image: ghcr.io/jardimdesoftware/edutrace-frontend:latest
    container_name: next-frontend
    expose:
     - "3000"
    environment:
     - PORT=3000
     - API_URL=${API_URL}
     - INTERNAL_API_URL=${INTERNAL_API_URL}
     - NEXT_PUBLIC_API_EDU_TRACE=${NEXT_PUBLIC_API_EDU_TRACE}
     - CLARITY_PROJECT_ID=${CLARITY_PROJECT_ID}
    networks:
     - app-net
    depends_on:
      nest-app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  nest-app:
    image: ghcr.io/jardimdesoftware/edutrace-backend:latest
    container_name: nest-backend
    expose:
      - "3000"
    environment:
     - PORT=3000
     - DATABASE_URL=${DATABASE_URL}
     - NODE_ENV=${NODE_ENV}
     - SECRET_KEY=${SECRET_KEY}
     - FRONTEND_URL=${FRONTEND_URL}
     - ADMIN_PASSWORD=${ADMIN_PASSWORD}
     - SMTP_HOST=${SMTP_HOST}
     - SMTP_PORT=${SMTP_PORT}
     - SMTP_USER=${SMTP_USER}
     - SMTP_PASS=${SMTP_PASS}
     - MAIL_FROM=${MAIL_FROM}
     - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
    networks:
      - app-net
    depends_on:
      postgres-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(()=>{}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine
    container_name: edutrace-gateway
    ports:
      - "127.0.0.1:${PROXY_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app-net
    depends_on:
      next-app:
        condition: service_healthy
      nest-app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  postgres-db:
    image: postgres:15
    container_name: postgres-db
    environment:
     - POSTGRES_USER=${POSTGRES_USER}
     - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
     - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  app-net:
    driver: bridge

volumes:
  pgdata:
